[project]
name = "study_cli"
version = "0.0.0"
description = "The study command line: ingest a folder of documents and query the index."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag_core",
]

[project.scripts]
study = "study_cli.main:main"

[tool.uv.sources]
rag_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_cli"]
