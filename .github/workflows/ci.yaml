name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Builds and tests only — no deploy (ADR 0003: local single-user scope).
jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    # Integration tests (rag_core/store) run against a real pgvector instance.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: study
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: study_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U study -d study_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
        env:
          TEST_DATABASE_URL: postgresql://study:change-me@localhost:5432/study_assistant_test

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      # Build-only (no deploy) so every push/PR is checked the same way as lint/mypy/pytest.
      # -W turns Sphinx warnings into errors. Deployment to Pages stays in docs-deploy.yaml.
      - name: Build docs
        run: uv run sphinx-build -b html docs site -W
