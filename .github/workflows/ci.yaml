name: CI

on:
  push:
    branches: [main, dev]
  # ready_for_review is not a default type; it runs the checks once when a draft is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Builds and tests only — no deploy (ADR 0003: local single-user scope).
jobs:
  checks:
    name: Lint, typecheck, test
    # Draft pull requests run nothing: the job is skipped until the PR is marked ready. A skipped
    # job reports success, which is harmless because GitHub will not merge a draft.
    if: &not-draft ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  docs:
    name: Docs build
    if: *not-draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      # Build-only (no deploy) so every push/PR is checked the same way as lint/mypy/pytest.
      # -W turns Sphinx warnings into errors. Deployment to Pages stays in docs-deploy.yaml.
      - name: Build docs
        run: uv run sphinx-build -b html docs site -W
