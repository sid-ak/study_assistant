name: Claude Code Review

# Reviews a pull request when it opens, and each push to it afterwards. The first review covers
# the whole pull request; each later review covers only the commits since the last review that
# reported, so a fix-up commit is not answered with a second pass over files already reviewed. Every
# run posts a report — findings or an explicit "no issues" — and the job fails if it does not, so a
# silent run shows up as a red check rather than a green one that explains nothing.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes a review still running for an older one. Nothing is lost by cancelling:
# a review's range starts at the last commit a posted report covered, not at the push that
# triggered it, so the surviving run takes in every commit the cancelled one would have.
concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A draft is not ready for review; `ready_for_review` reviews it once it is.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so the last reviewed commit and the merge base can be resolved.
          fetch-depth: 0

      # The range starts where the last posted report left off rather than at the push's previous
      # head: GitHub replaces a pending run in a concurrency group with a newer one, and a run can
      # fail or be cancelled, and in each case that run's commits must fall to the next review. Only
      # bot comments count, so a marker pasted into a human comment cannot move the range.
      - name: Find the last reviewed commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.user.type == "Bot") | .body | capture("^<!-- claude-code-review:(?<sha>[0-9a-f]{40}) -->").sha' \
            | tail -n 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Last reviewed commit: ${sha:-none}"

      - name: Work out what to review
        id: scope
        env:
          LAST_REVIEWED: ${{ steps.last.outputs.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "origin/$BASE_REF" "$HEAD")
          git diff --name-only "$merge_base" "$HEAD" | sort > "$RUNNER_TEMP/pr-files.txt"

          # Later reviews cover only the commits since the last reported one, as long as that
          # commit is still in the branch's history. With no earlier report, or after a force-push
          # rewrote history past it, the whole pull request is reviewed.
          if [ -n "$LAST_REVIEWED" ] \
            && git cat-file -e "$LAST_REVIEWED^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$LAST_REVIEWED" "$HEAD"; then
            mode=push
            from=$LAST_REVIEWED
            # Only files the pull request itself changes: a push that merges the base branch in
            # would otherwise hand the base branch's own changes to the review.
            git diff --name-only "$LAST_REVIEWED" "$HEAD" | sort | comm -12 - "$RUNNER_TEMP/pr-files.txt" \
              > "$RUNNER_TEMP/review-files.txt"
          else
            mode=full
            from=$merge_base
            cp "$RUNNER_TEMP/pr-files.txt" "$RUNNER_TEMP/review-files.txt"
          fi

          # Lockfiles are generated, so the workflow skips them here rather than leaving the choice
          # to the model. Every other file in scope must appear in the report's "Files reviewed"
          # list, which the last step checks against read-files.txt.
          lockfiles='(^|/)uv\.lock$'
          grep -v -E "$lockfiles" "$RUNNER_TEMP/review-files.txt" > "$RUNNER_TEMP/read-files.txt" || true
          grep -E "$lockfiles" "$RUNNER_TEMP/review-files.txt" > "$RUNNER_TEMP/skipped-files.txt" || true

          total=$(wc -l < "$RUNNER_TEMP/review-files.txt" | tr -d ' ')
          count=$(wc -l < "$RUNNER_TEMP/read-files.txt" | tr -d ' ')
          skipped=$(paste -s -d, - < "$RUNNER_TEMP/skipped-files.txt" | sed 's/,/, /g')

          # The report's scope line is built here from the real counts, so it cannot claim more
          # than was in scope.
          range="$(git rev-parse --short "$from")..$(git rev-parse --short "$HEAD")"
          if [ "$mode" = full ]; then
            scope_line="Reviewed $count of $total files in the whole pull request, $range."
          else
            commits=$(git rev-list --count "$from..$HEAD")
            commit_word=commits
            if [ "$commits" = 1 ]; then
              commit_word=commit
            fi
            scope_line="Reviewed $count of $total files changed since the last review, $range ($commits $commit_word)."
          fi
          if [ -n "$skipped" ]; then
            scope_line="$scope_line Skipped as generated: $skipped."
          fi

          {
            echo "mode=$mode"
            echo "from=$from"
            echo "count=$count"
            echo "scope_line=$scope_line"
            echo "skipped=${skipped:-none}"
            echo "files<<EOF"
            cat "$RUNNER_TEMP/read-files.txt"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$scope_line"
          cat "$RUNNER_TEMP/read-files.txt"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The prompt is written out here rather than using the code-review plugin, whose command
          # cannot be scoped: it always reviews the whole pull request through `gh pr diff`, stops
          # when Claude has commented before, and checks CLAUDE.md files, which this repository
          # does not have; its conventions live in AGENTS.md.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            REVIEW MODE: ${{ steps.scope.outputs.mode }}
            DIFF RANGE: ${{ steps.scope.outputs.from }}..${{ github.event.pull_request.head.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            SCOPE LINE: ${{ steps.scope.outputs.scope_line }}
            SKIPPED AS GENERATED: ${{ steps.scope.outputs.skipped }}
            FILES IN SCOPE (${{ steps.scope.outputs.count }}):
            ${{ steps.scope.outputs.files }}

            Review this pull request. The head commit is checked out in the working directory
            with full history. Do the whole review yourself in this session: there are no
            subagents or background tasks available, and this run ends as soon as you stop, so
            nothing can be left running to finish later.

            Order of work.
            1. Read the root AGENTS.md, then the PR title and description with `gh pr view` for
               the author's intent, then `git log DIFF_RANGE` for the commits.
            2. Go through FILES IN SCOPE one file at a time, every one of them. For each file run
               `git diff DIFF_RANGE -- <file>` on that file alone, never several files in one
               command. Read the whole file with Read when the diff does not show enough to judge
               it: a new module, a new test (to judge whether it can fail), or a change whose
               callers or callees matter. Read the nearest package-scoped AGENTS.md before the
               first file in that package.
            3. Compare implementations that claim the same contract, such as a Protocol's real
               implementation and its fake, for behavior one has and the other lacks.
            The files listed as SKIPPED AS GENERATED are not yours to review.

            Scope. Review only the changes in DIFF RANGE, restricted to FILES IN SCOPE. When
            REVIEW MODE is `push`, an earlier review already covered the pull request up to the
            start of the range; do not re-review or re-report anything outside the range. You may
            read other files for context, but every finding must be about a line the range
            changed.

            Findings. Only high-signal problems you have verified: code that will fail to build
            or import, logic that is wrong regardless of input, an unhandled exception, hang, or
            data loss reachable from user input, a test that cannot fail, or a clear violation of
            a rule in AGENTS.md (the root file or the nearest package-scoped one), an ADR under
            docs/decisions/, or docs/architecture.md that you can quote. Do not flag style,
            naming, subjective improvements, pre-existing issues, or anything the linters and type
            checker (ruff, mypy --strict) catch. Before reporting a finding, re-check it against
            the code.

            Worth a look. A problem you noticed in the range but could not confirm is not a
            finding, and it is not dropped either: it goes under "Worth a look", one sentence
            each, naming the file and what you would check to settle it.

            Reporting. You must finish by posting exactly one top-level comment with
            `gh pr comment`, whether or not you found anything. Use this layout, with HEAD SHA
            substituted in the first line and SCOPE LINE copied word for word:

            <!-- claude-code-review:HEAD_SHA -->
            ## Code review

            SCOPE LINE

            ### Findings

            A numbered list, each with a one-sentence description and a link to the line in the
            form https://github.com/REPO/blob/HEAD_SHA/path#L10-L15, or the line "No issues
            found."

            ### Worth a look

            A bulleted list, or the line "Nothing."

            <details>
            <summary>Files reviewed (N)</summary>

            One line per file in FILES IN SCOPE, in the form "- `path/to/file`: what changed and
            what you checked", with the path in backticks exactly as listed above. Every file in
            FILES IN SCOPE must appear: the workflow fails the review if one is missing.

            </details>

            Additionally post each finding, not the "Worth a look" items, as an inline comment
            with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`). If FILES
            IN SCOPE is empty, post the report with the line "Nothing in the pull request changed
            since the last review." in place of the three sections.
          # Subagents are refused, not merely discouraged. This run is headless, so it ends the
          # moment the main agent ends its turn; newer Claude Code versions start subagents in the
          # background, and a review that hands its work to one ends before any of it comes back.
          # That is what silenced the code-review plugin from Claude Code 2.1.273 on.
          #
          # The model is pinned rather than left to the action's default, which was Claude Sonnet 5.5,
          # so every review runs on Claude Opus 5.5 and the reviewer does not change between runs
          # without a commit here.
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools
            "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent,Task,Skill"
          # A run that decides something unexpected still leaves its reasoning in the run summary.
          display_report: "true"

      # The prompt requires a report on every run that lists every file in scope, and this holds
      # it to that. A review that posts no report, or whose "Files reviewed" list leaves out a file
      # from read-files.txt, fails here, so a silent or partial review is a red check instead of a
      # green one, and its transcript is kept by the next step. It is skipped only when Claude
      # never started — the one expected case is a pull request that changes this workflow, which
      # the action refuses to run until the change is on main, and says so in a warning on the run.
      - name: Check the review was reported and covered every file
        if: steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: "<!-- claude-code-review:${{ github.event.pull_request.head.sha }} -->"
        run: |
          set -euo pipefail
          # The latest bot report for this head. Each page yields an array of matching bodies;
          # jq -s joins the pages and keeps the last one, or writes nothing when there is none.
          gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.user.type == "Bot") | select(.body | startswith(env.MARKER)) | .body]' \
            | jq -s -r 'add | last // empty' > "$RUNNER_TEMP/report.md"
          if [ ! -s "$RUNNER_TEMP/report.md" ]; then
            echo "::error::The review posted no report for ${{ github.event.pull_request.head.sha }}."
            exit 1
          fi

          missing=0
          while IFS= read -r file; do
            if ! grep -qF -- "- \`$file\`:" "$RUNNER_TEMP/report.md"; then
              echo "::error::The report's Files reviewed list leaves out $file."
              missing=$((missing + 1))
            fi
          done < "$RUNNER_TEMP/read-files.txt"
          if [ "$missing" -gt 0 ]; then
            echo "::error::The review left out $missing file(s) in scope."
            exit 1
          fi
          echo "Report found, listing all $(wc -l < "$RUNNER_TEMP/read-files.txt" | tr -d ' ') file(s) in scope."

      # The full transcript of a run that failed, for working out why without leaving
      # `show_full_output` on in this public repository's logs. Kept briefly.
      - name: Upload the transcript of a failed review
        if: failure() && steps.claude-review.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript
          path: ${{ steps.claude-review.outputs.execution_file }}
          retention-days: 3
