# Lint / format / typecheck — the same gates CI runs (see .github/workflows/ci.yaml).
# Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve Markdown hard line breaks (two trailing spaces).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # Run the workspace mypy from the uv venv (same as CI's `uv run mypy`) so it resolves
        # psycopg / numpy / pytest / pydantic-settings. An isolated mirrors-mypy env can't see those
        # third-party deps and fails on import-not-found even when the code typechecks clean.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
