[project]
name = "rag_core_testing"
version = "0.0.0"
description = "Test doubles and test data for code that depends on rag_core; never a runtime dependency."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag_core",
]

[tool.uv.sources]
rag_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core_testing"]
