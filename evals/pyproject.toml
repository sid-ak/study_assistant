[project]
name = "evals"
version = "0.0.0"
description = "Golden-set evaluation of retrieval quality and latency."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rag_core",
]

[project.scripts]
study-eval = "evals.main:main"

[tool.uv.sources]
rag_core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
