[project]
name = "study-assistant"
version = "0.0.0"
description = "Local, single-user RAG study assistant over course materials."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

# The repo root is a uv workspace root, not an installable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

# Workspace members are developed in-place; wire them in as editable sources.
[tool.uv.sources]
rag_core = { workspace = true }

[dependency-groups]
dev = [
    "rag_core",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.0",
    "furo>=2024.8",
    "numpy>=2.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/rag_core/src"]

[tool.ruff.lint]
# D10x = docstring-presence rules (pydocstyle): every module, class, function, and __init__ must be
# documented, repo-wide. The stylistic D2xx/D4xx rules are deliberately left out so existing
# only presence of docstrings is enforced and not style.
select = ["E", "F", "I", "UP", "B", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.mypy]
python_version = "3.12"
strict = true
# Resolve the src-layout package from source so typechecking needs no install
# (keeps pre-commit's isolated mypy env and CI consistent).
mypy_path = "packages/rag_core/src"
files = ["packages/rag_core/src", "packages/rag_core/tests"]
explicit_package_bases = true
namespace_packages = true

# pgvector ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages"]
markers = [
    "integration: tests that require a live Postgres+pgvector instance (docker compose up -d)",
    "unit: fast tests with no external services (auto-applied to every non-integration test)",
]
