[project]
name = "study-assistant"
version = "0.0.0"
description = "Local, single-user RAG study assistant over course materials."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

# The repo root is a uv workspace root, not an installable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "cli", "evals", "services/*"]

# Workspace members are developed in-place; wire them in as editable sources.
[tool.uv.sources]
rag_core = { workspace = true }
rag_core_testing = { workspace = true }
study_cli = { workspace = true }
evals = { workspace = true }
mcp_server = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
    "rag_core",
    "rag_core_testing",
    "study_cli",
    "evals",
    "mcp_server",
    "api",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.0",
    "furo>=2024.8",
    "numpy>=2.0",
    "sphinx-autobuild>=2025.8.25",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/rag_core/src",
    "packages/rag_core_testing/src",
    "cli/src",
    "evals/src",
    "services/mcp_server/src",
    "services/api/src",
]

[tool.ruff.lint]
# D10x = docstring-presence rules (pydocstyle): every module, class, function, and __init__ must be
# documented, repo-wide. The stylistic D2xx/D4xx rules are left out, so only the presence of a
# docstring is enforced, not its style.
select = ["E", "F", "I", "UP", "B", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.mypy]
python_version = "3.12"
strict = true
# Resolve the src-layout packages from source so typechecking needs no install
# (keeps pre-commit's isolated mypy env and CI consistent).
mypy_path = [
    "packages/rag_core/src",
    "packages/rag_core_testing/src",
    "cli/src",
    "evals/src",
    "services/mcp_server/src",
    "services/api/src",
    "services/api/tests",
]
files = [
    "packages/rag_core/src",
    "packages/rag_core_testing/src",
    "packages/rag_core/tests",
    "cli/src",
    "cli/tests",
    "evals/src",
    "evals/tests",
    "services/mcp_server/src",
    "services/mcp_server/tests",
    "services/api/src",
    "services/api/tests",
]
explicit_package_bases = true
namespace_packages = true

# pgvector ships no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "cli", "evals", "services"]
markers = [
    "integration: tests that need a live Postgres+pgvector instance (docker compose up -d) or download and load a real model",
    "unit: fast tests with no external services (auto-applied to every non-integration test)",
]
