[project]
name = "study_chat"
version = "0.0.0"
description = "A local Streamlit chat page over the study-ask agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "api",
    "streamlit>=1.40",
]

[project.scripts]
study-chat = "study_chat.launch:main"

[tool.uv.sources]
api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_chat"]
